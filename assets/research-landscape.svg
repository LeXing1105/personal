<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">Research landscape of Le Xing</title>
  <desc id="desc">A structured technology map showing brain-computer interfaces, EEG electrodes, neuromodulation, signal processing, deep learning, disease research, and edge AI around closed-loop neurotechnology.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f5f9f7"/>
      <stop offset="1" stop-color="#eef4f1"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d6b62"/>
      <stop offset="1" stop-color="#315f8c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8bb174"/>
      <stop offset="1" stop-color="#c4664a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#152328" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dbe5df" stroke-width="1" opacity="0.46"/>
    </pattern>
    <style>
      .small { font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .label { font: 800 16px "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .coreTitle { font: 800 24px "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .coreSub { font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: 0.06em; }
      .muted { fill: #5f6c72; }
      .ink { fill: #172026; }
      .line { stroke: #cddbd4; stroke-width: 1.4; fill: none; }
      .link { stroke: #0d6b62; stroke-width: 2; fill: none; stroke-linecap: round; opacity: 0.72; }
      .pulse { stroke: #c4664a; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="1" y="1" width="1178" height="358" rx="22" fill="url(#panel)" stroke="#dde4df"/>
  <rect x="1" y="1" width="1178" height="358" rx="22" fill="url(#grid)" opacity="0.72"/>
  <path d="M38 286C170 216 228 264 324 196C410 135 478 78 592 108C708 139 770 257 884 244C1003 231 1058 142 1144 168" class="line" opacity="0.48"/>
  <path d="M61 83C190 131 252 70 362 106C463 139 493 226 606 225C721 224 770 115 888 108C1004 101 1062 171 1124 136" class="line" opacity="0.35"/>

  <g filter="url(#softShadow)">
    <rect x="444" y="92" width="292" height="176" rx="18" fill="#ffffff" stroke="#dbe5df"/>
    <circle cx="514" cy="180" r="46" fill="#edf6f3" stroke="#8bb174" stroke-width="2"/>
    <path d="M504 143c-20 4-33 19-34 39-1 23 16 40 39 40h12c27 0 47-19 47-43 0-21-15-37-37-40-10-2-19 0-27 4z" fill="none" stroke="#0d6b62" stroke-width="3" stroke-linecap="round"/>
    <path d="M499 164c13 2 22 10 26 22m-39-2c18-3 36 4 49 21m-18-58c8 8 11 19 8 31m23-14c-9 7-14 17-13 30" fill="none" stroke="#315f8c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="490" cy="166" r="4" fill="#c4664a"/>
    <circle cx="525" cy="147" r="4" fill="#8bb174"/>
    <circle cx="550" cy="188" r="4" fill="#315f8c"/>

    <text x="594" y="157" class="coreSub" fill="#0d6b62">INTEGRATED RESEARCH FOCUS</text>
    <text x="594" y="187" class="coreTitle" fill="#172026">Closed-loop</text>
    <text x="594" y="216" class="coreTitle" fill="#172026">Neurotechnology</text>
    <path d="M594 236h94" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M444 156C359 130 308 107 230 95" class="link"/>
    <path d="M444 204C356 229 314 250 237 265" class="link"/>
    <path d="M590 92C565 53 529 43 462 45" class="link"/>
    <path d="M736 151C819 128 867 104 945 91" class="link"/>
    <path d="M736 206C825 235 869 254 948 266" class="link"/>
    <path d="M602 268C574 312 523 326 456 320" class="link"/>
    <path d="M670 268C710 312 757 324 829 313" class="link"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="58" y="52" width="225" height="86" rx="12" fill="#ffffff" stroke="#dbe5df"/>
    <text x="132" y="82" class="label ink">BCI &amp; EEG</text>
    <text x="132" y="106" class="small muted">neural decoding</text>
    <path d="M86 102c8-23 23-33 44-31 18 1 29 11 35 27" fill="none" stroke="#0d6b62" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="103" cy="86" r="4" fill="#315f8c"/>
    <circle cx="124" cy="78" r="4" fill="#c4664a"/>
    <circle cx="146" cy="92" r="4" fill="#8bb174"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="62" y="222" width="242" height="92" rx="12" fill="#ffffff" stroke="#dbe5df"/>
    <text x="132" y="254" class="label ink">EEG Electrodes</text>
    <text x="132" y="278" class="small muted">materials + fabrication</text>
    <rect x="86" y="247" width="28" height="28" rx="6" fill="#f0f5ef" stroke="#8bb174" stroke-width="2"/>
    <path d="M78 286h44m-37-9h30m-23-39v-16m16 16v-16" stroke="#315f8c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="261" r="6" fill="#0d6b62"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="336" y="24" width="194" height="82" rx="12" fill="#ffffff" stroke="#dbe5df"/>
    <text x="377" y="56" class="label ink">Signal Processing</text>
    <path d="M360 80h18l9-22 17 43 15-32 12 11h69" class="pulse"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="886" y="49" width="234" height="91" rx="12" fill="#ffffff" stroke="#dbe5df"/>
    <text x="958" y="82" class="label ink">Deep Learning</text>
    <text x="958" y="106" class="small muted">classification + deployment</text>
    <circle cx="918" cy="75" r="5" fill="#0d6b62"/>
    <circle cx="918" cy="112" r="5" fill="#0d6b62"/>
    <circle cx="940" cy="94" r="5" fill="#315f8c"/>
    <line x1="923" y1="75" x2="935" y2="94" stroke="#8bb174" stroke-width="1.8"/>
    <line x1="923" y1="112" x2="935" y2="94" stroke="#8bb174" stroke-width="1.8"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="889" y="220" width="224" height="92" rx="12" fill="#ffffff" stroke="#dbe5df"/>
    <text x="957" y="253" class="label ink">Edge AI</text>
    <text x="957" y="277" class="small muted">wearable inference</text>
    <rect x="918" y="248" width="28" height="28" rx="5" fill="#edf6f3" stroke="#315f8c" stroke-width="2"/>
    <path d="M913 256h-12m12 12h-12m45-12h12m-12 12h12m-32-25v-12m13 12v-12m-13 50v-12m13 12v-12" stroke="#0d6b62" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="328" y="276" width="218" height="62" rx="12" fill="#ffffff" stroke="#dbe5df"/>
    <text x="362" y="313" class="label ink">Neuromodulation</text>
    <path d="M338 307c11-12 20-12 31 0s20 12 31 0" class="pulse"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="725" y="276" width="232" height="62" rx="12" fill="#ffffff" stroke="#dbe5df"/>
    <text x="775" y="313" class="label ink">Disease Research</text>
    <path d="M742 306h13l7-18 12 37 9-19h18" class="pulse"/>
  </g>

  <g opacity="0.9">
    <circle cx="360" cy="164" r="3" fill="#0d6b62"/>
    <circle cx="389" cy="174" r="2.5" fill="#315f8c"/>
    <circle cx="804" cy="168" r="3" fill="#c4664a"/>
    <circle cx="836" cy="183" r="2.5" fill="#8bb174"/>
    <circle cx="598" cy="52" r="2.5" fill="#315f8c"/>
    <circle cx="667" cy="316" r="2.5" fill="#0d6b62"/>
  </g>
</svg>
